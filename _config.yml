url: "https://pdxhackerspace.org"
title: PDX Hackerspace
description: "PDX Hackerspace is an educational 501(c)(3) non-profit hackerspace and makerspace in Portland, Oregon. Tools, workshops, events, and community for hacking, making, and learning."
og_image: "/images/logo-bordered.png"

exclude:
  - SEO-PLAN.md
  - _posts/AGENTS.md

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  categories:
    - newsletter
    - blog

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /:categories/:year/:month/:title/
