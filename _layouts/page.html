---
layout: default
---
{% if page.faq_page %}{% include faq-chat-cta.html %}{% endif %}
<div id='main' role='main'>
  <div class='full parallax' style='background-image: url({{ page.hero_image | prepend: "/images/" | relative_url }}); color: #fff;'>
    <div class='row'>
      <div class='large-12 columns'>
        <div class="mod modSectionHeader big">
          <div class="special-title centered-text">
            <h1 style="color: #fff;">{{ page.hero_title | default: page.title }}</h1>
          </div>
          {% if page.subtitle %}<h3 class='centered-text' style='color: #fff'>{{ page.subtitle }}</h3>{% endif %}
        </div>
      </div>
    </div>
    <div class='four spacing'></div>
  </div>
  {{ content }}
</div>
